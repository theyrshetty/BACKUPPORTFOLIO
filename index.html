<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yashas Shetty — Portfolio</title>
  <meta name="description" content="Yashas Shetty — data scientist, machine learning engineer, and musician. Explore projects, research, and the creative B-side." />
  <meta property="og:title" content="Yashas Shetty — Portfolio" />
  <meta property="og:description" content="Data science, machine learning, and music. Projects, research, and the creative B-side." />
  <meta property="og:type" content="website" />

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.2/p5.min.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,800;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Short+Stack&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/hero.css" />
  <link rel="stylesheet" href="styles/about.css" />
  <link rel="stylesheet" href="styles/experience.css" />
  <link rel="stylesheet" href="styles/projects.css">
  <link rel="stylesheet" href="styles/research.css">
  <link rel="stylesheet" href="styles/extras.css">

  <link rel="stylesheet" href="styles/floating-icons.css">
  <link rel="stylesheet" href="styles/sidenav.css" />
</head>

<body class="is-loading">
  <div class="site-loader" role="status" aria-live="polite" aria-label="Yashas Shetty">
    <div class="site-loader__name" aria-hidden="true">
      <h1><span>Yashas</span><span>Shetty</span></h1>
    </div>
  </div>

  <!-- Hero -->
  <header class="hero" id="top">
    <div id="marble-canvas" aria-hidden="true"></div>
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="hero__scrim" aria-hidden="true"></div>

    <div class="hero__name">
      <h1><span>Yashas</span><span>Shetty</span></h1>
    </div>
  </header>

  <!-- Nav (injected by sidenav.js) -->
  <div id="nav-placeholder"></div>

  <!-- Main content — populated by loader.js from manifest -->
  <main id="main"></main>

  <footer>
    <img class="footer__signature" src="assets/svgs/signature.svg" alt="Yashas Shetty signature" width="333" height="200" decoding="async" loading="eager">
    <div class="footer__details">
      <span>Last updated on 19th July 2026</span>
      <div class="footer__center">
        <button type="button" class="footer__back-to-top" aria-controls="top">Back to top</button>
      </div>
      <span>&copy; Yashas Shetty &middot; Built with p5.js</span>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="scripts/loader.js"></script>
  <script src="scripts/marble.js"></script>
  <script src="scripts/transition.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/sidenav.js" defer></script>
  <script src="scripts/floating-icons.js" defer></script>

  <script src="scripts/about.js"></script>
  <script src="scripts/experience.js" defer></script>
  <script src="scripts/projects.js" defer></script>
  <script src="scripts/extras.js" defer></script>
  <script src="scripts/contact.js" defer></script>
  <script src="scripts/footer.js" defer></script>
</body>
</html>
