<section id="sideb">
  <div class="sideb__stage-wrapper" id="sideb-wrapper">
    <div class="sideb__stage" id="sideb-stage">
      <div class="sideb__bg-fade" id="sideb-bg-fade" aria-hidden="true"></div>

      <div class="sideb__label-curve" id="sideb-label" aria-hidden="true"></div>

      <div class="sideb__cover" id="sideb-cover" aria-hidden="true">
        <span class="sideb__cover-stamp">B SIDE</span>
      </div>

      <div class="sideb__vinyl" id="sideb-vinyl">
        <div class="sideb__vinyl-assembly">
          <div class="sideb__tonearm" id="sideb-tonearm" aria-hidden="true">
            <svg viewBox="0 0 60 60" width="60" height="60" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <circle cx="46" cy="10" r="5"/>
              <g class="sideb__tonearm-arm" id="sideb-tonearm-arm">
                <path d="M46 15 L18 46"/>
                <path d="M18 46 L10 52"/>
              </g>
            </svg>
          </div>
          <div class="sideb__vinyl-disc">
            <div class="sideb__vinyl-label">
              <img
                class="sideb__vinyl-label-img"
                src="assets/babitha.jpeg"
                alt="Babitha Blasters"
              >
              <span class="sideb__vinyl-label-fallback">B-Side</span>
            </div>
            <div class="sideb__vinyl-hole"></div>
          </div>
        </div>
      </div>

      <div class="sideb__gallery" id="sideb-gallery" aria-label="Photo gallery">
        <div class="sideb__gallery-backdrop" aria-hidden="true"></div>
        <div class="sideb__gallery-viewport">
          <div class="sideb__gallery-columns" id="sideb-gallery-columns">
            <div class="sideb__gallery-column sideb__gallery-column--reverse"></div>
            <div class="sideb__gallery-column"></div>
            <div class="sideb__gallery-column sideb__gallery-column--reverse"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
